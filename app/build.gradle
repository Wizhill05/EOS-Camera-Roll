apply plugin: 'com.android.application'
android {
    namespace 'dev.aryan.cameralinklab'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.aryan.cameralinklab'
        minSdk 29
        targetSdk 35
        versionCode 9
        versionName '0.6.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    signingConfigs {
        eosRelease {
            if (System.getenv('EOS_KEYSTORE_PATH')) {
                storeFile file(System.getenv('EOS_KEYSTORE_PATH'))
                storePassword System.getenv('EOS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('EOS_KEY_ALIAS')
                keyPassword System.getenv('EOS_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig System.getenv('EOS_KEYSTORE_PATH') ? signingConfigs.eosRelease : signingConfigs.debug } }
}

dependencies { implementation 'androidx.recyclerview:recyclerview:1.4.0'; testImplementation 'org.json:json:20250517'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.17' }
