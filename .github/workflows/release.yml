name: Build and publish APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'native/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'scripts/release.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eos-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Restore update-compatible signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EOS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Release signing secret is missing.' >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eos-release.keystore"
      - name: Verify, build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          EOS_GITHUB_REPOSITORY: ${{ github.repository }}
          EOS_KEYSTORE_PATH: ${{ runner.temp }}/eos-release.keystore
          EOS_KEYSTORE_PASSWORD: android
          EOS_KEY_ALIAS: androiddebugkey
          EOS_KEY_PASSWORD: android
        run: ./scripts/release.sh
